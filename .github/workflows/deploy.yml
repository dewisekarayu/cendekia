
name: Cendekia - Build & Test

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Deploy ke website produksi cendekia.my.id?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Verify manifest
        run: test -f public/build/manifest.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cendekia-frontend-build
          path: public/build/
          if-no-files-found: error

  ssh-test:
    name: Test SSH Connection
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cendekia_actions
          chmod 600 ~/.ssh/cendekia_actions

      - name: Verify SSH host fingerprint
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          ssh-keyscan -T 10 -p "$DEPLOY_PORT" -t ed25519 "$DEPLOY_HOST" > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | grep -F 'SHA256:oLqanP6CyiCDLLUhwVGVGbL76I1s9A/cPeu6yffigqU'
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cendekia_actions \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'echo "SSH CONNECTION SUCCESS"; pwd'

  preview-deploy:
    name: Preview Deployment
    runs-on: ubuntu-latest
    needs: [build, ssh-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Vite build
        uses: actions/download-artifact@v4
        with:
          name: cendekia-frontend-build
          path: public/build/

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cendekia_actions
          chmod 600 ~/.ssh/cendekia_actions

          ssh-keyscan -T 10 -p "$DEPLOY_PORT" -t ed25519 "$DEPLOY_HOST" > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | grep -F 'SHA256:oLqanP6CyiCDLLUhwVGVGbL76I1s9A/cPeu6yffigqU'
          chmod 600 ~/.ssh/known_hosts

      - name: Preview file changes
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          rsync -rlzvnc --itemize-changes \
            -e "ssh -i $HOME/.ssh/cendekia_actions -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $DEPLOY_PORT" \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.env*' \
            --exclude='.htaccess' \
            --exclude='/storage/' \
            --exclude='/vendor/' \
            --exclude='/bootstrap/cache/' \
            --exclude='/public/storage/' \
            --exclude='/.well-known/' \
            --exclude='error_log' \
            --exclude='/public/test.php' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/home/cendeki9/public_html/"

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build, ssh-test, preview-deploy]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && github.ref == 'refs/heads/main' }}
    timeout-minutes: 20

    concurrency:
      group: cendekia-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Vite build
        uses: actions/download-artifact@v4
        with:
          name: cendekia-frontend-build
          path: public/build/

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cendekia_actions
          chmod 600 ~/.ssh/cendekia_actions

          ssh-keyscan -T 10 -p "$DEPLOY_PORT" -t ed25519 "$DEPLOY_HOST" > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | grep -F 'SHA256:oLqanP6CyiCDLLUhwVGVGbL76I1s9A/cPeu6yffigqU'
          chmod 600 ~/.ssh/known_hosts

      - name: Check production files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/cendekia_actions" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -eu
             cd /home/cendeki9/public_html
             test -f .env
             test -f .htaccess
             test -f artisan
             test -f public/index.php
             test -f composer.json
             command -v php
             command -v composer
             echo "Production preflight OK"'

      - name: Deploy files to hosting
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          rsync -rlzvc --itemize-changes \
            -e "ssh -i $HOME/.ssh/cendekia_actions -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $DEPLOY_PORT" \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.env*' \
            --exclude='.htaccess' \
            --exclude='/storage/' \
            --exclude='/vendor/' \
            --exclude='/bootstrap/cache/' \
            --exclude='/public/storage/' \
            --exclude='/.well-known/' \
            --exclude='error_log' \
            --exclude='/public/test.php' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/home/cendeki9/public_html/"

      - name: Install PHP dependencies and clear cache
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/cendekia_actions" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -eu
             cd /home/cendeki9/public_html
             composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
             php artisan optimize:clear
             test -f public/build/manifest.json
             echo "Production setup complete"'

      - name: Check website response
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 2 \
            --output /dev/null \
            https://cendekia.my.id/
          echo "Website HTTP check passed"
